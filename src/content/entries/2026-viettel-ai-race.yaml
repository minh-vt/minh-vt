summary:
  vi: 'Thi một mình trong một tuần. Bài toán là làm mô hình ngôn ngữ LFM2.5 trả lời nhanh hơn trên một phần GPU được chia sẵn. Mình viết ba kernel Triton gộp các bước tính toán và xếp hạng 77 trên 220.'
  en: 'A solo week-long contest: make the LFM2.5 language model answer faster on a slice of a GPU. I wrote three Triton kernels that fuse compute steps and finished 77th of 220.'
detail:
  vi: 'Ba kernel chỉ giảm khoảng 1% độ trễ. Bài viết trên blog kể lại vì sao.'
  en: 'The kernels cut latency by about 1%. The blog post explains why.'
