summary:
  vi: 'Cùng Ngô Đại Thanh Quang làm dự án du lịch thực tế ảo từ mô hình 3D và dữ liệu địa lý. Dự án đạt giải Nhất khoa học kỹ thuật cấp tỉnh và vào vòng quốc gia.'
  en: 'A virtual travel project with Ngo Dai Thanh Quang, built from 3D models and geographic data. It won the provincial science fair and went on to the national round.'
detail:
