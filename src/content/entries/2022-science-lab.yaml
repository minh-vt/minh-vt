  title: Đồng sáng lập Science Lab
  summary: Tháng 11/2022, Science Lab được thành lập với tinh thần tiên phong trong việc mang giáo dục STEM đến với học sinh Phú Yên, hoạt động theo định hướng phi lợi nhuận và được trường THPT chuyên Lương Văn Chánh bảo trợ. Một số hoạt động nổi bật của Science Lab là Trại hè STEM thường niên (Summer Hackathon), chương trình ươm tạo dự án STEM Incubator Program (SIP) và lớp học STEM lưu động.
