en:
  title: Co-founded Science Lab
  summary: 'In November 2022 I co-founded Science Lab with friends from Luong Van Chanh High School for the Gifted: a not-for-profit STEM education group for students in Phu Yen, sponsored by the school. It runs an annual summer hackathon, the STEM Incubator Program (SIP) for student projects, and the STEM Mobile Class. I still run several of its projects.'
