  year: '2022'
  title: Đồng sáng lập Science Lab
  summary: Tháng 11/2022, mình cùng một nhóm bạn ở trường chuyên Lương Văn Chánh lập Science Lab, nhóm giáo dục STEM cho học sinh Phú Yên, hoạt động theo định hướng phi lợi nhuận và được trường bảo trợ. Science Lab tổ chức trại hè STEM thường niên (Summer Hackathon), chương trình ươm tạo dự án STEM Incubator Program (SIP) và lớp học STEM lưu động. Mình vẫn điều hành một số dự án ở đây.
