en:
  title: Co-founded Science Lab
  summary: Science Lab was founded in November 2022 to pioneer STEM education for students in Phú Yên. It operates on a non-profit basis, with Lương Văn Chánh High School for the Gifted as its legal sponsor. Its programs are an annual STEM summer camp (Summer Hackathon), the STEM Incubator Program (SIP), and mobile STEM classes
