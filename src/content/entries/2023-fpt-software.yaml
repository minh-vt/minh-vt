en:
  title: Embedded software at FPT Software
  summary: An internship, then a full-time role in the OS & Middleware group. The main work was the image service of the akaCam camera on Rockchip chips.
  detail: Rewrote it from Python and OpenCV in C++ and GStreamer. The camera went from 32 to 60 frames per second while CPU use fell from 44.6% to 24.5%.
