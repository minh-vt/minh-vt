  title: Phần mềm nhúng ở FPT Software
  summary: Thực tập rồi làm chính thức ở nhóm OS & Middleware. Việc chính là phần mềm xử lý hình ảnh của camera akaCam trên chip Rockchip.
  detail: Viết lại phần này từ Python và OpenCV sang C++ và GStreamer. Camera chạy từ 32 lên 60 khung hình mỗi giây, CPU giảm từ 44,6% xuống 24,5%.
