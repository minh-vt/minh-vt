summary:
  vi: 'Chương trình của Science Lab đưa các buổi học STEM tới học sinh THCS ở những vùng khó khăn của Phú Yên. Hai mùa đầu phối hợp với nhiều trường THCS; riêng đợt "Robot trong vỏ hạt dẻ" có gần 400 học sinh tham gia.'
  en: 'Science Lab''s programme that brings hands-on STEM sessions to lower-secondary students in the less-served parts of Phu Yen. The first two seasons worked with several schools; one round, "Robot in a nutshell", drew nearly 400 students.'
