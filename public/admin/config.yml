# Sveltia CMS configuration. Decap compatible; lives in the repo, no database.
# Mirrors src/content.config.ts: prose per locale, structure in one file.
backend:
  name: github
  repo: minh-vt/minh-vt
  branch: main

media_folder: public/images
public_folder: /images

locale: vi
publish_mode: simple

collections:
  - name: about
    label: Giới thiệu
    files:
      - name: about_vi
        label: Tiếng Việt
        file: src/content/about/vi.mdx
        fields:
          - { name: title, label: Tiêu đề, widget: string }
          - { name: lead, label: Một câu giới thiệu, widget: string }
          - { name: updated, label: Cập nhật, widget: datetime, required: false }
          - { name: body, label: Nội dung, widget: markdown }
      - name: about_en
        label: English
        file: src/content/about/en.mdx
        fields:
          - { name: title, label: Title, widget: string }
          - { name: lead, label: One line, widget: string }
          - { name: updated, label: Updated, widget: datetime, required: false }
          - { name: body, label: Body, widget: markdown }

  - name: posts
    label: Bài viết
    label_singular: Bài
    folder: src/content/posts
    extension: mdx
    format: frontmatter
    create: true
    slug: '{{slug}}'
    summary: '{{title}}'
    sortable_fields: [date]
    fields:
      - { name: title, label: Tiêu đề, widget: string }
      - { name: description, label: Mô tả, widget: text }
      - { name: date, label: Ngày, widget: datetime }
      - { name: tags, label: Thẻ, widget: list, required: false }
      - { name: draft, label: Bản nháp, widget: boolean, default: false }
      - name: origin
        label: Đăng lần đầu
        widget: object
        required: false
        fields:
          - { name: label, label: Nơi đăng, widget: string }
          - { name: url, label: Liên kết, widget: string }
      - { name: body, label: Nội dung, widget: markdown }

  - name: facts
    label: Các mốc
    label_singular: Mốc
    folder: src/content/facts
    extension: yaml
    format: yaml
    create: true
    summary: '{{fields.year}} · {{fields.title.vi}}'
    sortable_fields: [order]
    fields:
      - { name: order, label: Thứ tự, widget: number, value_type: int, default: 999 }
      - { name: year, label: Năm, widget: string }
      - name: title
        label: Tiêu đề
        widget: object
        fields:
          - { name: vi, label: Tiếng Việt, widget: string }
          - { name: en, label: English, widget: string }
      - name: summary
        label: Mô tả
        widget: object
        fields:
          - { name: vi, label: Tiếng Việt, widget: text }
          - { name: en, label: English, widget: text }
      - name: metric
        label: Con số
        widget: object
        required: false
        fields:
          - { name: vi, label: Tiếng Việt, widget: string, required: false }
          - { name: en, label: English, widget: string, required: false }
      - name: refs
        label: Nguồn (id)
        widget: list
        required: false
        hint: 'Id của file trong src/content/references, ví dụ tuoitre-vorc-2024'

  - name: work
    label: Việc đã làm
    label_singular: Dự án
    folder: src/content/work
    extension: yaml
    format: yaml
    create: true
    summary: '{{fields.year}} · {{fields.title.vi}}'
    sortable_fields: [order]
    fields:
      - { name: order, label: Thứ tự, widget: number, value_type: int, default: 999 }
      - { name: year, label: Năm, widget: string }
      - name: title
        label: Tiêu đề
        widget: object
        fields:
          - { name: vi, label: Tiếng Việt, widget: string }
          - { name: en, label: English, widget: string }
      - name: summary
        label: Mô tả
        widget: object
        fields:
          - { name: vi, label: Tiếng Việt, widget: text }
          - { name: en, label: English, widget: text }
      - name: metric
        label: Con số
        widget: object
        required: false
        fields:
          - { name: vi, label: Tiếng Việt, widget: string, required: false }
          - { name: en, label: English, widget: string, required: false }
      - { name: tech, label: Công nghệ, widget: string }
      - { name: refs, label: Nguồn (id), widget: list, required: false }
      - { name: cover, label: Ảnh bìa, widget: image, required: false }

  - name: credentials
    label: Chứng chỉ
    label_singular: Chứng chỉ
    folder: src/content/credentials
    extension: yaml
    format: yaml
    create: true
    summary: '{{fields.year}} · {{fields.title.vi}}'
    fields:
      - { name: year, label: Năm, widget: string }
      - name: title
        label: Tên
        widget: object
        fields:
          - { name: vi, label: Tiếng Việt, widget: string }
          - { name: en, label: English, widget: string }
      - name: issuer
        label: Nơi cấp
        widget: object
        fields:
          - { name: vi, label: Tiếng Việt, widget: string }
          - { name: en, label: English, widget: string }
      - { name: issuerId, label: 'Đơn vị (id, để lấy logo)', widget: string, required: false }
      - { name: file, label: 'File (PDF hoặc ảnh)', widget: file }
      - { name: extra, label: 'File thứ hai', widget: file, required: false }
      - name: kind
        label: Loại
        widget: select
        options: [course, award, role]

  - name: outlets
    label: Đơn vị đăng
    label_singular: Đơn vị
    folder: src/content/outlets
    extension: yaml
    format: yaml
    create: true
    summary: '{{fields.name.vi}} (tier {{fields.tier}})'
    fields:
      - name: name
        label: Tên
        widget: object
        fields:
          - { name: vi, label: Tiếng Việt, widget: string }
          - { name: en, label: English, widget: string }
      - name: tier
        label: Mức uy tín
        widget: select
        options:
          - { label: '1 · báo quốc gia, ban tổ chức, cơ quan', value: 1 }
          - { label: '2 · trang kết quả chính thức', value: 2 }
          - { label: '3 · địa phương, tổ chức', value: 3 }
      - { name: logo, label: Logo (đường dẫn trong /logos), widget: string, required: false }

  - name: references
    label: Nguồn
    label_singular: Nguồn
    folder: src/content/references
    extension: yaml
    format: yaml
    create: true
    summary: '{{fields.outlet}} — {{fields.title}}'
    sortable_fields: [date]
    fields:
      - { name: url, label: Liên kết, widget: string }
      - name: outlet
        label: Đơn vị đăng (id)
        widget: string
        hint: 'Id của file trong src/content/outlets, ví dụ tuoitre'
      - { name: title, label: Tiêu đề gốc, widget: string, hint: 'Giữ nguyên ngôn ngữ gốc' }
      - { name: label, label: Nhãn ngắn, widget: string, required: false }
      - { name: date, label: Ngày, widget: datetime, required: false }
      - name: kind
        label: Loại
        widget: select
        options: [press, video, award, code, social]

  - name: strings
    label: Chuỗi giao diện
    files:
      - name: strings_vi
        label: Tiếng Việt
        file: src/content/strings/vi.json
        format: json
        fields:
          - { name: '*', label: Chuỗi, widget: object }
      - name: strings_en
        label: English
        file: src/content/strings/en.json
        format: json
        fields:
          - { name: '*', label: Chuỗi, widget: object }

  - name: site
    label: Thông tin site
    files:
      - name: site
        label: Liên hệ
        file: src/content/site.json
        format: json
        fields:
          - { name: email, label: Email, widget: string }
          - { name: github, label: GitHub, widget: string }
          - { name: linkedin, label: LinkedIn, widget: string }
          - name: location
            label: Nơi ở
            widget: object
            fields:
              - { name: vi, label: Tiếng Việt, widget: string }
              - { name: en, label: English, widget: string }
